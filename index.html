<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Cahier du Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1512" media="(prefers-color-scheme: dark)">
<style>
/* Application installée : on dégage la barre d'état et la barre d'accueil de l'iPhone */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--board);z-index:15}
.install{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:520px;margin:0 auto}
.install p{font-size:14px}
.install .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.install svg{width:18px;height:18px;vertical-align:-3px}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout : poste de travail du staff — barre d'équipe, navigation par onglets (tableau de bord → guide), panneaux de données ; schémas sur pelouse, aimants rouge/bleu, plots orange. */
:root{
  --board:#F2F5F1; --panel:#FFFFFF; --ink:#13201A; --muted:#5A6A61; --line:#D7DFD9; --soft:#E7EEE8;
  --grass:#1D6A42; --grass2:#22784B; --chalk:#FFFFFF;
  --red:#C9352B; --blue:#2452B6; --joker:#E6A50E; --gk:#6B3FB0; --cone:#EE7A1A;
  --accent:#1D6A42; --accent-ink:#FFFFFF;
  --good:#1B7041; --good-bg:#DCF0E3; --warn:#8F5A00; --warn-bg:#FBEBCB; --crit:#B3261E; --crit-bg:#FADBD8; --info:#2452B6; --info-bg:#DFE7F9; --mute-bg:#E9ECEA;
  --f-display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --board:#0E1512; --panel:#16201B; --ink:#E5EEE8; --muted:#94A69B; --line:#27362E; --soft:#1C2922;
  --grass:#18583A; --grass2:#1C6342; --chalk:#F4F8F5;
  --red:#E4574C; --blue:#5A86E8; --joker:#F0B729; --gk:#9B72E0; --cone:#F28A33;
  --accent:#3FB97A; --accent-ink:#0B1410;
  --good:#5FD08F; --good-bg:#16352A; --warn:#F2B84B; --warn-bg:#3A2E14; --crit:#FF7A6E; --crit-bg:#3D1C1A; --info:#8FB0F5; --info-bg:#1B2742; --mute-bg:#212C26; color-scheme:dark;}}
:root[data-theme="dark"]{
  --board:#0E1512; --panel:#16201B; --ink:#E5EEE8; --muted:#94A69B; --line:#27362E; --soft:#1C2922;
  --grass:#18583A; --grass2:#1C6342; --chalk:#F4F8F5;
  --red:#E4574C; --blue:#5A86E8; --joker:#F0B729; --gk:#9B72E0; --cone:#F28A33;
  --accent:#3FB97A; --accent-ink:#0B1410;
  --good:#5FD08F; --good-bg:#16352A; --warn:#F2B84B; --warn-bg:#3A2E14; --crit:#FF7A6E; --crit-bg:#3D1C1A; --info:#8FB0F5; --info-bg:#1B2742; --mute-bg:#212C26; color-scheme:dark;}
*{box-sizing:border-box}
/* Règles de base répétées ici pour que le fichier marche aussi ouvert seul, hors de claude.ai */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--board);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(30px,5vw,46px);line-height:.95;font-weight:800;text-transform:uppercase}
h2{font-size:26px;font-weight:700;text-transform:uppercase}
h3{font-size:20px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
.brand h1 span{color:var(--accent)}
.teamline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.teamline b{font-family:var(--f-display);font-size:20px;text-transform:uppercase}
.hint{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:12px 16px}
.hint p{font-size:14px}
.hint.demo{background:var(--warn-bg)}

/* Nav */
.nav{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:thin;position:sticky;top:env(safe-area-inset-top,0px);background:var(--board);z-index:5}
.tab{border:0;background:none;padding:10px 12px;font-family:var(--f-display);font-size:18px;font-weight:700;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{display:flex;flex-direction:column;gap:16px}
.phead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.phead p{color:var(--muted);max-width:62ch;font-size:14.5px}

/* Cards, grids */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{background:var(--soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact b{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.fact small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:22px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{min-width:0}
.li .t b{display:block}

/* Pills (status : couleur + point + libellé) */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--mute-bg);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--info-bg);color:var(--info)}
.md{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:2px 7px;border-radius:5px;background:var(--ink);color:var(--board);white-space:nowrap}

/* Buttons & forms */
.btn{border:0;border-radius:8px;padding:9px 15px;font-weight:700;font-size:14px;background:var(--accent);color:var(--accent-ink);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--panel);color:var(--crit);border:1.5px solid var(--line)}
.btn.small{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--board)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.ctl{display:flex;flex-direction:column;gap:6px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:80px;resize:vertical}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent)}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--board);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl td.wrap{white-space:normal}
.tbl th{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;background:var(--soft)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--soft)}
.tbl input,.tbl select{padding:4px 6px;width:auto}
.tbl input[type="number"]{width:64px}

/* Charts */
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.neg{fill:var(--red)}
.chart .bar:hover{opacity:.8}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Timeline saison */
.tl svg{display:block;width:100%;height:auto}
.tl .ph{stroke:var(--panel);stroke-width:2}
.tl .phl{font-family:var(--f-display);font-weight:700;font-size:13px;fill:var(--ink)}
.tl .today{stroke:var(--ink);stroke-width:2}
.tl .mt{fill:var(--ink)}
.tl .ax{fill:var(--muted);font-family:var(--f-mono);font-size:10px}

/* Categories (méthode) */
.cats{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px}
.cat{border:1.5px solid var(--line);background:var(--panel);border-radius:10px 10px 4px 4px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cat b{font-family:var(--f-display);font-size:26px;line-height:1;font-weight:800}
.cat small{font-size:11px;color:var(--muted);white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cat[aria-pressed="true"] small{color:var(--accent-ink)}
@media (max-width:760px){.cats{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:420px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.profile{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media (max-width:860px){.profile{grid-template-columns:1fr}}
.mix{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.mix i{display:block;height:100%}
.mixleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.mixleg i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}
.pro{border-left:3px solid var(--accent);padding-left:12px;font-size:14.5px}
.week{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--soft)}
.day .d{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase}
.day .f{font-size:13.5px;min-width:0}
.day .f b{display:block;font-size:14px}
.day.match{background:var(--accent);color:var(--accent-ink)}
.load{display:flex;gap:3px}
.load i{width:6px;height:16px;border-radius:2px;background:var(--line)}
.load i.on{background:var(--cone)}

/* Sessions (générateur + planning) */
.sess{display:flex;flex-direction:column;gap:10px}
.blk{display:grid;grid-template-columns:78px 132px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 10px}
.blk .t{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.blk .t b{font-family:var(--f-display);font-size:24px;color:var(--ink);font-weight:800;line-height:1}
.thumb{border-radius:6px;overflow:hidden;display:block;width:100%;border:0;padding:0;background:none}
.thumb svg{display:block;width:100%;height:auto}
.blk .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.role{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.blk .name{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.1;text-align:left;border:0;background:none;padding:0}
.insp{font-size:13px;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
@media (max-width:680px){
  .blk{grid-template-columns:96px minmax(0,1fr);padding:10px}
  .blk .t{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:8px}
  .acts{grid-column:1/-1;flex-direction:row}
}
.sumrow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:12px 16px}
.sumrow .stat{font-size:13.5px;color:var(--muted)}
.sumrow .stat b{font-family:var(--f-display);font-size:22px;color:var(--ink);margin-right:4px}
.edrow{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:8px;align-items:center}

/* Library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;transition:border-color .15s,transform .15s}
.ex:hover{border-color:var(--accent);transform:translateY(-2px)}
.ex svg{display:block;width:100%;height:auto}
.ex .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.ex h3{font-size:20px;line-height:1.1}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:4px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.ph{background:var(--ink);color:var(--board)}
.tag.pro{background:var(--accent);color:var(--accent-ink)}
.int{display:inline-flex;gap:2px;vertical-align:middle}
.int i{width:5px;height:12px;border-radius:1px;background:var(--line)}
.int i.on{background:var(--cone)}
input[type="search"]{max-width:280px}

/* Pitch svg */
.pitch-bg{fill:var(--grass)} .pitch-st{fill:var(--grass2)}
.chalk{stroke:var(--chalk);fill:none}
.zone{stroke:var(--chalk);fill:var(--chalk);fill-opacity:.07;stroke-dasharray:1.6 1.2;stroke-width:.45}
.pl{stroke:var(--chalk);stroke-width:.5}
.pl-A{fill:var(--red)} .pl-B{fill:var(--blue)} .pl-N{fill:var(--joker)} .pl-G{fill:var(--gk)}
.cone{fill:var(--cone)}
.ball{fill:#FFFFFF;stroke:#13201A;stroke-width:.3}
.ar{stroke:var(--chalk);fill:none;stroke-width:.55}
.ar.run{stroke-dasharray:1.4 1}
.lbl{fill:var(--chalk);font-family:var(--f-mono);font-size:3px;text-anchor:middle}
.ahead{fill:var(--chalk)}
.anim-wrap{position:relative}
.playbtn{position:absolute;right:10px;bottom:10px;border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;background:rgba(10,20,15,.72);color:#FFFFFF;cursor:pointer}
.stepcap{position:absolute;left:10px;top:10px;background:rgba(10,20,15,.72);color:#FFFFFF;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:6px;max-width:calc(100% - 20px)}
.stepcap:empty{display:none}

/* Modals */
.ov{position:fixed;inset:0;background:rgba(8,14,11,.55);display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#ovx{z-index:25}
.modal{background:var(--panel);border-radius:14px;max-width:880px;width:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.mhead{display:flex;justify-content:space-between;gap:12px;padding:18px 20px 12px;align-items:flex-start}
.mhead h2{font-size:28px;line-height:1}
.mpad{padding:4px 20px 22px;display:flex;flex-direction:column;gap:16px}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line);background:var(--soft)}
.x{border:0;background:var(--soft);border-radius:8px;width:36px;height:36px;font-size:20px;flex:none}
.mdiag{background:var(--grass)}
.mdiag svg{display:block;width:100%;height:auto;max-height:460px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);padding:10px 20px;border-bottom:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:22px;height:10px}
.mbody{padding:16px 20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:18px 26px}
.mbody .full{grid-column:1/-1}
@media (max-width:640px){.mbody{grid-template-columns:1fr}}
.mbody h3,.mpad h3{font-size:17px;text-transform:uppercase;margin-bottom:6px}
.mbody ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.mfacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.mfacts{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Timer */
.timer{position:fixed;inset:0;z-index:30;background:var(--grass);color:#FFFFFF;display:flex;flex-direction:column;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));gap:16px;overflow-y:auto}
.timer .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer .eyebrow{color:rgba(255,255,255,.75)}
.timer h2{font-size:clamp(26px,5vw,44px);line-height:1}
.clock{font-family:var(--f-display);font-weight:800;font-size:clamp(80px,20vw,200px);line-height:.9;font-variant-numeric:tabular-nums;text-align:center}
.clock.end{color:#FFD54A}
.tprog{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
.tprog i{display:block;height:100%;background:#FFD54A}
.tbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tbtns button{border:2px solid #FFFFFF;background:transparent;color:#FFFFFF;border-radius:10px;padding:12px 22px;font-weight:700;font-size:16px}
.tbtns button.main{background:#FFFFFF;color:#13201A}
.tsteps{display:flex;gap:6px;flex-wrap:wrap}
.tsteps span{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.15)}
.tsteps span.cur{background:#FFFFFF;color:#13201A;font-weight:700}
.tsteps span.done{opacity:.5;text-decoration:line-through}
.tmain{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:900px;width:100%;margin:0 auto}
.tkeys{font-size:15px;max-width:60ch;margin:0 auto;text-align:center;opacity:.9}
.tdiag{border-radius:10px;overflow:hidden;max-width:520px;width:100%;margin:0 auto;border:2px solid rgba(255,255,255,.35)}
.tdiag svg{display:block;width:100%;height:auto}

/* Guide */
.guide{display:flex;flex-direction:column;gap:14px;max-width:900px}
.guide .lead{font-size:16px;max-width:65ch}
.gpart{font-family:var(--f-display);font-size:24px;font-weight:800;text-transform:uppercase;margin-top:10px}
.gstep{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 16px}
.gnum{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:.9;color:var(--accent);grid-row:span 3}
.gstep h3{font-size:22px;text-transform:uppercase}
.gstep .gbody{display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.gstep ul,.gstep ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.gstep .btn{justify-self:start;margin-top:6px}
@media (max-width:520px){.gstep{grid-template-columns:1fr}.gnum{grid-row:auto;font-size:34px}}
.faq details{border-bottom:1px solid var(--line);padding:10px 0}
.faq summary{font-weight:700;cursor:pointer}
.faq details p{margin-top:6px;color:var(--muted)}
/* Mode simple : écran Aujourd'hui, cartes à toucher, détails repliés */
.appbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.appbar h1{font-size:clamp(28px,7vw,40px)}
.back{border:0;background:none;color:var(--accent);font-weight:700;font-size:15px;padding:4px 0;align-self:flex-start}
.icon-btn{flex:none;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.today{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}
.today .eyebrow{color:inherit;opacity:.85}
.today h2{font-size:30px;line-height:1}
.today.soft{background:var(--soft);color:var(--ink)}
.btn.inv{background:var(--accent-ink);color:var(--accent)}
.btn.ghost-inv{background:transparent;color:var(--accent-ink);border:1.5px solid currentColor}
.grid2.tight{gap:10px}
.cards{display:flex;flex-direction:column;gap:8px}
.rc{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;min-height:60px}
button.rc:hover{border-color:var(--accent)}
.rc.flat{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px;background:transparent}
.rc.flat:last-child{border-bottom:0}
.rc .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rc .main b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .main span{font-size:13px;color:var(--muted)}
.rc .main .eyebrow{font-size:10.5px}
.rc .num{font-family:var(--f-display);font-size:22px;font-weight:800;width:30px;text-align:center;color:var(--muted);flex:none}
.rc .big{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--accent);flex:none}
.rc .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.rc .count{font-size:13px;color:var(--muted);white-space:nowrap}
.score{font-family:var(--f-display);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.datebox{flex:none;width:44px;text-align:center;font-family:var(--f-display);line-height:1}
.datebox b{display:block;font-size:24px}
.datebox small{font-size:11px;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono)}
.launch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.launch{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lbtn{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;min-height:92px}
.lbtn:hover{border-color:var(--accent)}
.lbtn .ic svg{width:26px;height:26px;color:var(--accent)}
.lbtn b{font-family:var(--f-display);font-size:19px;text-transform:uppercase;line-height:1}
.row-between{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bigline{font-family:var(--f-display);font-size:30px;font-weight:800}
details.more{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:block}
details.more summary{font-weight:700;cursor:pointer}
details.more[open]>*:not(summary){margin-top:12px}
.pane h3{font-size:18px;text-transform:uppercase;margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const WQ={};
async function flush(path){const q=WQ[path];q.busy=true;
  while(q.has){q.has=false;const d=q.data;
    try{d===null?await ST.db.doc(path).delete():await ST.db.doc(path).set(d);}
    catch(e){writeErr(e);}}
  q.busy=false;}
function writeErr(e){const c=e&&e.code;
  if(c==='invalid_argument'){ST.canWrite=false;renderTop();toast('Lecture seule : ton accès ne permet pas de modifier les données.');}
  else if(c==='quota_exceeded')toast("L'espace de stockage est plein : supprime d'anciennes séances.");
  else if(c==='revoked'){ST.canWrite=false;renderTop();}
  else toast("L'enregistrement a échoué. Réessaie dans un instant.");}
function put(path,data){
  if(!ST.canWrite){toast('Lecture seule : tu ne peux pas modifier les données.');return false;}
  if(ST.mode==='db'){const q=WQ[path]||(WQ[path]={busy:false,has:false});q.data=data;q.has=true;if(!q.busy)flush(path);}
  else{const [c,id]=path.split('/');
    if(c==='season'||c==='settings'){data===null?delete LOC.docs[path]:LOC.docs[path]=data;}
    else{data===null?delete LOC[c][id]:LOC[c][id]=data;}
    locSave();fromLoc();refresh();}
  return true;}
const strip=o=>{const c=clone(o);delete c.id;return c;};
async function initStore(){
  locLoad();

  if(db){
    ST.db=db;ST.mode='db';
    if(user){try{const c=await user.can('data.write');if(c===false)ST.canWrite=false;}catch(e){}}
    const fail=e=>{if(e&&e.code==='revoked'){ST.canWrite=false;}renderTop();};
    ['players','sessions','matches'].forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({...d.data(),id:d.id}));sortAll();refresh();},fail));
    db.doc('season/plan').onSnapshot(s=>{S.plan=s.exists?s.data():null;refresh();},fail);
    db.doc('settings/team').onSnapshot(s=>{S.team=s.exists?s.data():null;if(S.team&&!st.catTouched)st.cat=+S.team.cat||7;refresh();},fail);

}

function loadMap(){ // pid -> {date: charge (UA)}
  const m={};const add=(p,d,v)=>{if(!v)return;(m[p]||(m[p]={}))[d]=((m[p]||{})[d]||0)+v;};
  S.sessions.forEach(s=>{const dur=+s.dur||0;Object.entries(s.rpe||{}).forEach(([p,r])=>{if(s.att&&s.att[p]&&+r>0)add(p,s.date,+r*dur);});});
  S.matches.forEach(mt=>Object.entries(mt.pl||{}).forEach(([p,v])=>{if(+v.min>0&&+v.rpe>0)add(p,mt.date,+v.min*+v.rpe);}));
  return m;}
function sumRange(dates,from,to){let s=0;for(const d in dates)if(d>=from&&d<=to)s+=dates[d];return s;}
function acwrOf(dates,ref){
  dates=dates||{};const acute=sumRange(dates,addD(ref,-6),ref),chronic=sumRange(dates,addD(ref,-27),ref)/4;
  const first=Object.keys(dates).sort()[0];
  const young=!first||diffD(ref,first)<21;
  return {acute:Math.round(acute),chronic:Math.round(chronic),r:chronic>0&&!young?acute/chronic:null,young};}
function zoneOf(r){if(r==null)return ['Données insuffisantes',''];if(r<.8)return ['Sous-charge','info'];if(r<=1.3)return ['Zone optimale','good'];if(r<=1.5)return ['Vigilance','warn'];return ['Risque élevé','crit'];}
function resOf(m){if(m.gf==null||m.ga==null||m.gf===''||m.ga==='')return null;return +m.gf>+m.ga?'V':+m.gf<+m.ga?'D':'N';}
const played=()=>S.matches.filter(m=>resOf(m));
const nextMatch=()=>S.matches.find(m=>m.date>=TODAY&&!resOf(m));
function phaseOf(d){const p=S.plan;if(!p||!p.phases)return null;return p.phases.find(x=>d>=x.start&&d<=x.end)||null;}
function attRate(pid){const past=S.sessions.filter(s=>s.date<=TODAY&&s.date>=addD(TODAY,-27)&&s.att&&Object.keys(s.att).length);if(!past.length)return null;return Math.round(100*past.filter(s=>s.att[pid]).length/past.length);}
function goalsOf(pid){let g=0,a=0,n=0,min=0,notes=[];S.matches.forEach(m=>{const v=(m.pl||{})[pid];if(v&&+v.min>0){n++;min+=+v.min;g+=+v.g||0;a+=+v.a||0;if(+v.note>0)notes.push(+v.note);}});return {g,a,n,min,note:notes.length?notes.reduce((x,y)=>x+y,0)/notes.length:null};}

let uidc=0;
function shorten(x1,y1,x2,y2,a,b){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;return [x1+dx/L*a,y1+dy/L*a,x2-dx/L*b,y2-dy/L*b];}
function zig(x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,n=Math.max(2,Math.floor(L/2.4)),px=-dy/L,py=dx/L;let s=`M${x1} ${y1}`;for(let i=1;i<n;i++){const t=i/n,o=(i%2?1:-1)*1.1;s+=` L${(x1+dx*t+px*o).toFixed(2)} ${(y1+dy*t+py*o).toFixed(2)}`;}return s+` L${x2} ${y2}`;}
function isArrow(e){return e[0].length===1&&'prd'.includes(e[0]);}

function makeAnim(svg,d,cap){

  const setCap=t=>{if(cap)cap.textContent=t;};

      rest();ars.forEach(a=>a.style.opacity='.15');

          if(ars[i])ars[i].style.opacity='1';});
        if(!await tween(dur,t=>moves.forEach(m=>put(m.o,m.fx+(m.tx-m.fx)*t,m.fy+(m.ty-m.fy)*t)),my))return;

function weeklyChart(){
  const L=loadMap();const w0=monday(TODAY);const weeks=[];
  for(let i=7;i>=0;i--){const ws=addD(w0,-7*i),we=addD(ws,6);let tot=0,n=0;for(const p in L){const v=sumRange(L[p],ws,we);if(v>0){tot+=v;n++;}}weeks.push({ws,v:n?Math.round(tot/n):0,n});}
  const max=Math.max(...weeks.map(w=>w.v),100);const step=max>3000?1000:max>1500?500:max>600?200:100;const top=Math.ceil(max/step)*step;
  const W=640,H=210,l=46,r=10,t=12,b=30,ih=H-t-b,bw=(W-l-r)/weeks.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Charge hebdomadaire moyenne par joueur sur 8 semaines">`;
  for(let v=0;v<=top;v+=step){const y=t+ih-ih*v/top;s+=`<line class="gl" x1="${l}" x2="${W-r}" y1="${y}" y2="${y}"/><text class="ax" x="${l-6}" y="${y+3}" text-anchor="end">${v}</text>`;}
  weeks.forEach((w,i)=>{const h=ih*w.v/top,x=l+i*bw+bw*.18,bwid=bw*.64,y=t+ih-h,rr=Math.min(4,h);
    if(h>0)s+=`<path class="bar" d="M${x} ${t+ih} V${y+rr} Q${x} ${y} ${x+rr} ${y} H${x+bwid-rr} Q${x+bwid} ${y} ${x+bwid} ${y+rr} V${t+ih}Z"><title>Semaine du ${frDate(w.ws,{day:'numeric',month:'short'})} : ${w.v} UA en moyenne (${w.n} joueurs)</title></path>`;
    s+=`<text class="ax" x="${l+i*bw+bw/2}" y="${H-10}" text-anchor="middle">${frDate(w.ws,{day:'2-digit',month:'2-digit'})}</text>`;});
  return s+`</svg>`;
}

  if(!p){el.innerHTML=`<div class="card"><h3>Créer le plan de saison</h3><p class="muted">Indique la reprise et la fin de saison. Le module propose 5 phases que tu pourras modifier.</p><div class="form"><div class="field"><label for="sp-start">Reprise</label><input id="sp-start" type="date" value="${TODAY.slice(0,4)}-07-01" ${dis()}></div><div class="field"><label for="sp-end">Fin</label><input id="sp-end" type="date" value="${+TODAY.slice(0,4)+1}-06-07" ${dis()}></div></div>${ST.canWrite?`<button class="btn" data-act="plan-create" style="align-self:flex-start">Créer le plan</button>`:''}</div>`;return;}
  const s0=p.start,s1=p.end,span=Math.max(1,diffD(s1,s0));const W=800,H=96,X=d=>10+780*Math.min(1,Math.max(0,diffD(d,s0)/span));
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Phases de la saison">`;
  (p.phases||[]).forEach((ph,i)=>{const x=X(ph.start),w=Math.max(2,X(ph.end)-x);svg+=`<rect class="ph" x="${x}" y="18" width="${w}" height="34" rx="4" style="fill:${PHC[i%PHC.length]};fill-opacity:.85"><title>${esc(ph.nom)} : ${frDate(ph.start)} → ${frDate(ph.end)}</title></rect>${w>70?`<text class="phl" x="${x+6}" y="40" style="fill:#FFFFFF">${esc(ph.nom)}</text>`:''}`;});
  S.matches.filter(m=>m.date>=s0&&m.date<=s1).forEach(m=>{svg+=`<rect class="mt" x="${X(m.date)-1}" y="56" width="2" height="9"><title>${frDate(m.date)} · ${esc(m.opp)}</title></rect>`;});
  for(let d=s0.slice(0,8)+'01';d<=s1;d=isoOf(new Date(dOf(d).getFullYear(),dOf(d).getMonth()+1,1))){if(d>=s0)svg+=`<text class="ax" x="${X(d)}" y="82">${frDate(d,{month:'short'})}</text>`;}
  if(TODAY>=s0&&TODAY<=s1)svg+=`<line class="today" x1="${X(TODAY)}" x2="${X(TODAY)}" y1="10" y2="68"/>`;
  svg+='</svg>';
  const cur=phaseOf(TODAY);
  const weeks=[];for(let w=monday(TODAY<s0?s0:TODAY);w<=s1&&weeks.length<(st.allWeeks?60:6);w=addD(w,7))weeks.push(w);
  el.innerHTML=`<div class="today soft"><span class="eyebrow">Phase en cours</span><h2>${cur?esc(cur.nom):'Hors saison'}</h2><p>${cur?`Jusqu'au ${frDate(cur.end,{day:'numeric',month:'long'})} · ${esc(cur.focus||'')}`:''}</p></div>
  <div class="card tl">${svg}${ST.canWrite?`<button class="btn small ghost" data-act="plan-edit" style="align-self:flex-start">Modifier les phases</button>`:''}</div>
  <h3>Prochaines semaines</h3>
  <div class="cards">${weeks.map(w=>{const we=addD(w,6),ms=S.matches.filter(m=>m.date>=w&&m.date<=we),ss=S.sessions.filter(s=>s.date>=w&&s.date<=we);
    return `<div class="rc static"><span class="main"><b>Semaine du ${frDate(w,{day:'numeric',month:'short'})}</b><span>${ms.length?ms.map(m=>esc(m.opp)).join(', '):'Pas de match'}</span></span><span class="side">${ss.length?`<span class="count">${ss.length} séance(s)</span>`:ms.length&&ST.canWrite?`<button class="btn small" data-act="genweek" data-date="${ms[ms.length-1].date}">Générer</button>`:''}</span></div>`;}).join('')}</div>
  <button class="btn small ghost" data-act="weeks-toggle" style="align-self:flex-start">${st.allWeeks?'Afficher moins':'Afficher toute la saison'}</button>`;

/* =================== Séances =================== */
function buildMD(md){
  const t=MDT[md];if(!t)return null;const used=new Set();
  const blocks=t.b.map(([ph,cands,min])=>{
    let pick=cands.map(id=>EXI[id]).find(e=>e&&!used.has(e.id)&&e.c[0]<=st.cat&&st.cat<=e.c[1]);
    if(!pick){const alt=avail(ph).filter(e=>!used.has(e.id));pick=alt.length?rnd(alt):null;}
    if(!pick)return null;used.add(pick.id);return {ex:pick.id,min};}).filter(Boolean);
  return {blocks,dur:blocks.reduce((a,b)=>a+b.min,0),obj:t.obj};
}
function sessCard(s){
  const n=Object.values(s.att||{}).filter(Boolean).length;
  return `<button class="rc" data-act="sview" data-id="${s.id}">${datebox(s.date)}<span class="main"><b>${esc(s.title||MDINFO[s.md]||'Séance')}</b><span>${s.md&&s.md!=='Libre'?esc(s.md)+' · ':''}${s.dur||0} min</span></span><span class="side">${n?`<span class="count">${n} présents</span>`:s.date<=TODAY?'<span class="pill warn">Présence à saisir</span>':''}</span></button>`;
}
function renderSeances(el){
  const up=S.sessions.filter(s=>s.date>=TODAY),past=S.sessions.filter(s=>s.date<TODAY).reverse();
  const nm=nextMatch();
  el.innerHTML=`${ST.canWrite?`<div class="btns"><button class="btn" data-act="genweek" data-date="${nm?nm.date:''}">Générer la semaine</button><button class="btn ghost" data-act="sedit">+ Séance</button></div>`:''}
  <h3>À venir</h3>
  ${up.length?`<div class="cards">${up.map(sessCard).join('')}</div>`:`<div class="empty">Aucune séance prévue.${nm?' Touche « Générer la semaine » pour préparer le match du '+frDate(nm.date,{day:'numeric',month:'long'})+'.':''}</div>`}
  <h3>Passées</h3>
  ${past.length?`<div class="cards">${past.slice(0,3).map(sessCard).join('')}</div>${past.length>3?`<details class="more" data-k="past"><summary>Voir les ${past.length-3} séances plus anciennes</summary><div class="cards">${past.slice(3,40).map(sessCard).join('')}</div></details>`:''}`:'<p class="muted">Aucune séance passée.</p>'}
  <details class="more" data-k="gen"><summary>Séance rapide (générateur)</summary><div id="gen" style="display:flex;flex-direction:column;gap:14px"></div></details>`;
  if(!st.sess.length)generate();renderGen();
}
function generate(){
  const T=st.T,th=st.theme;let pri=avail('pri',th);if(pri.length<2)pri=pri.concat(avail('pri').filter(e=>!pri.includes(e)));
  const r5=x=>Math.max(5,Math.round(x/5)*5);const tR=T<=60?5:10,tE=r5(T*.2),tJ=r5(T*.27),tP=T-tE-tJ-tR;
  const blocks=[{role:'ech',ex:rnd(avail('ech')),min:tE}];const p1=rnd(pri);
  if(T>=60&&pri.length>1){const a=r5(tP/2);const rest=pri.filter(e=>e!==p1);const pref=rest.filter(e=>th==='all'||e.th.includes(th));blocks.push({role:'pri',ex:p1,min:a},{role:'pri',ex:rnd(pref.length?pref:rest),min:tP-a});}
  else blocks.push({role:'pri',ex:p1,min:tP});
  blocks.push({role:'jeu',ex:rnd(avail('jeu')),min:tJ},{role:'ret',ex:rnd(avail('ret')),min:tR});
  st.sess=blocks.filter(b=>b.ex);
}

  <div class="sumrow"><span class="stat"><b>${st.T}</b>minutes</span><div class="btns"><button class="btn ghost" data-act="regen">Nouvelle proposition</button><button class="btn ghost" data-act="gen-timer">▶ Chrono</button>${ST.canWrite?`<button class="btn" data-act="gen-save">Enregistrer dans le planning</button>`:''}</div></div>

/* =================== Matchs =================== */
function goalsChart(ms){
  const W=640,H=200,l=30,r=10,t=14,b=28,mid=t+(H-t-b)/2,half=(H-t-b)/2;const max=Math.max(3,...ms.map(m=>Math.max(+m.gf||0,+m.ga||0)));const bw=(W-l-r)/ms.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Buts marqués et encaissés par match">`;
  [max,0,max].forEach((v,i)=>{const y=i===0?t:i===1?mid:t+2*half;s+=`<line class="gl" x1="${l}" x2="${W-r}" y1="${y}" y2="${y}"/><text class="ax" x="${l-6}" y="${y+3}" text-anchor="end">${v}</text>`;});
  ms.forEach((m,i)=>{const x=l+i*bw+bw*.22,w=bw*.56,hf=half*(+m.gf||0)/max,ha=half*(+m.ga||0)/max,lab=`${frDate(m.date,{day:'numeric',month:'short'})} · ${m.opp} : ${m.gf}-${m.ga}`;
    if(hf>0)s+=`<path class="bar" d="M${x} ${mid-1} V${mid-hf+3} Q${x} ${mid-hf} ${x+3} ${mid-hf} H${x+w-3} Q${x+w} ${mid-hf} ${x+w} ${mid-hf+3} V${mid-1}Z"><title>${esc(lab)}</title></path>`;
    if(ha>0)s+=`<path class="bar neg" d="M${x} ${mid+1} V${mid+ha-3} Q${x} ${mid+ha} ${x+3} ${mid+ha} H${x+w-3} Q${x+w} ${mid+ha} ${x+w} ${mid+ha-3} V${mid+1}Z"><title>${esc(lab)}</title></path>`;
    s+=`<text class="ax" x="${l+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${esc(String(m.opp).slice(0,8))}</text>`;});
  return s+'</svg>';
}
function matchCard(m){
  const r=resOf(m);
  return `<button class="rc" data-act="medit" data-id="${m.id}">${datebox(m.date)}<span class="main"><b>${esc(m.opp)}</b><span>${m.home?'Domicile':'Extérieur'}${m.comp?' · '+esc(m.comp):''}</span></span><span class="side">${r?`<span class="score">${m.gf} – ${m.ga}</span><span class="pill ${r==='V'?'good':r==='D'?'crit':''}">${r==='V'?'Victoire':r==='D'?'Défaite':'Nul'}</span>`:`<span class="pill info">J-${diffD(m.date,TODAY)}</span>`}</span></button>`;
}
function renderMatchs(el){
  const pl=played(),up=S.matches.filter(m=>!resOf(m)&&m.date>=TODAY),late=S.matches.filter(m=>!resOf(m)&&m.date<TODAY);
  const w=pl.filter(m=>resOf(m)==='V').length,n=pl.filter(m=>resOf(m)==='N').length,l=pl.filter(m=>resOf(m)==='D').length;
  const avg=(k,i)=>{const v=pl.map(m=>m.st&&m.st[k]&&m.st[k][i]).filter(x=>x!==''&&x!=null&&!isNaN(+x)).map(Number);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const f1=v=>v==null?'—':v.toFixed(1).replace('.',',');const ti=avg('tirs',0),tc=avg('cadres',0);
  const lead=S.players.map(p=>({p,...goalsOf(p.id)})).filter(x=>x.n).sort((a,b)=>(b.g+b.a)-(a.g+a.a)||b.min-a.min);
  el.innerHTML=`<div class="row-between"><div><b class="bigline">${w}V · ${n}N · ${l}D</b><p class="muted">${pl.reduce((a,m)=>a+(+m.gf||0),0)} buts marqués · ${pl.reduce((a,m)=>a+(+m.ga||0),0)} encaissés</p></div>${ST.canWrite?`<button class="btn small" data-act="medit">+ Match</button>`:''}</div>
  ${late.length?`<h3>Score à saisir</h3><div class="cards">${late.map(matchCard).join('')}</div>`:''}
  <h3>À venir</h3>${up.length?`<div class="cards">${up.slice(0,3).map(matchCard).join('')}</div>${up.length>3?`<details class="more" data-k="mup"><summary>Voir les ${up.length-3} autres matchs</summary><div class="cards">${up.slice(3).map(matchCard).join('')}</div></details>`:''}`:'<p class="muted">Aucun match à venir.</p>'}
  <h3>Résultats</h3>${pl.length?`<div class="cards">${pl.slice().reverse().slice(0,5).map(matchCard).join('')}</div>${pl.length>5?`<details class="more" data-k="mpast"><summary>Voir les ${pl.length-5} résultats plus anciens</summary><div class="cards">${pl.slice().reverse().slice(5).map(matchCard).join('')}</div></details>`:''}`:'<p class="muted">Aucun match joué.</p>'}
  ${pl.length?`<details class="more" data-k="mstats"><summary>Statistiques de la saison</summary>
    <div class="tiles"><div class="fact"><span class="eyebrow">Tirs par match</span><b>${f1(ti)}</b><small>${ti&&tc!=null?Math.round(100*tc/ti)+' % cadrés':''}</small></div><div class="fact"><span class="eyebrow">Possession</span><b>${avg('poss',0)==null?'—':Math.round(avg('poss',0))+' %'}</b><small>moyenne</small></div><div class="fact"><span class="eyebrow">Récupérations</span><b>${f1(avg('recup',0))}</b><small>par match</small></div><div class="fact"><span class="eyebrow">Tirs adverses</span><b>${f1(avg('tirs',1))}</b><small>par match</small></div></div>
    <div class="legend2"><span><i style="background:var(--accent)"></i>Buts marqués</span><span><i style="background:var(--red)"></i>Buts encaissés</span></div><div class="chart">${goalsChart(pl.slice(-12))}</div>
    <h3>Buteurs et passeurs</h3><div class="cards">${lead.slice(0,8).map(x=>`<button class="rc flat" data-act="pview" data-id="${x.p.id}"><span class="num">${esc(x.p.num||'')}</span><span class="main"><b>${esc(x.p.nom)}</b><span>${x.n} matchs · ${x.min} min${x.note!=null?' · note '+x.note.toFixed(1).replace('.',','):''}</span></span><span class="side"><span class="score">${x.g} B · ${x.a} PD</span></span></button>`).join('')}</div>
  </details>`:''}`;
}

function saveMatch(id){
  const opp=$('m-opp').value.trim();if(!opp){toast("Indique l'adversaire.");$('m-opp').focus();return;}
  const stt={};document.querySelectorAll('[data-st]').forEach(i=>{const k=i.dataset.st;(stt[k]||(stt[k]=['','']))[+i.dataset.i]=i.value===''?'':+i.value;});
  const pl={};document.querySelectorAll('[data-pl]').forEach(r=>{const o={};r.querySelectorAll('[data-k]').forEach(i=>{if(i.value!=='')o[i.dataset.k]=+i.value;});if(Object.keys(o).length)pl[r.dataset.pl]=o;});
  const old=id?S.matches.find(x=>x.id===id):null;
  const d={...(old?strip(old):{}),date:$('m-date').value||TODAY,opp,home:$('m-home').value==='1',comp:$('m-comp').value.trim(),gf:$('m-gf').value===''?'':+$('m-gf').value,ga:$('m-ga').value===''?'':+$('m-ga').value,st:stt,pl,notes:$('m-notes').value.trim()};

}

/* =================== Chrono =================== */
const tm={i:0,left:0,run:false,h:null,ac:null,wl:null,blocks:[],title:'',shown:-1,anim:null};
function beep(n){try{if(!tm.ac)return;for(let k=0;k<n;k++){const o=tm.ac.createOscillator(),g=tm.ac.createGain();o.frequency.value=880;o.connect(g);g.connect(tm.ac.destination);const t=tm.ac.currentTime+k*.35;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);}}catch(e){}}
async function wake(on){try{if(on&&navigator.wakeLock&&!tm.wl)tm.wl=await navigator.wakeLock.request('screen');if(!on&&tm.wl){await tm.wl.release();tm.wl=null;}}catch(e){}}
function openTimer(blocks,title){
  if(!blocks.length){toast('Cette séance ne contient aucun bloc.');return;}
  try{tm.ac=tm.ac||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  tm.blocks=blocks;tm.title=title;tm.i=0;tm.left=blocks[0].min*60;tm.run=false;tm.shown=-1;$('timer').hidden=false;renderTimer();$('tplay').focus();
}
function renderTimer(){
  const b=tm.blocks[tm.i],e=b.ex,tot=b.min*60;const mm=pad(Math.floor(tm.left/60)),ss=pad(tm.left%60);const next=tm.blocks[tm.i+1];
  if(tm.shown===tm.i&&$('tclock')){const c=$('tclock');c.textContent=`${mm}:${ss}`;c.classList.toggle('end',tm.left<=30);document.querySelector('#timer .tprog i').style.width=`${(1-tm.left/tot)*100}%`;$('tplay').textContent=tm.run?'Pause':'Démarrer';return;}
  tm.shown=tm.i;if(tm.anim)tm.anim.stop();
  $('timer').innerHTML=`<div class="row"><span class="eyebrow">${esc(tm.title)} · bloc ${tm.i+1}/${tm.blocks.length}</span><button class="x" data-act="tclose" aria-label="Fermer le chrono" style="background:rgba(255,255,255,.15);color:#fff">×</button></div>
   <div class="tsteps">${tm.blocks.map((s,i)=>`<span class="${i<tm.i?'done':i===tm.i?'cur':''}">${PH[s.ex.ph]} · ${s.min}′</span>`).join('')}</div>
   <div class="tmain"><div style="text-align:center;display:flex;flex-direction:column;gap:6px"><span class="eyebrow">${PH[e.ph]}</span><h2>${e.n}</h2></div>
   <div class="clock${tm.left<=30?' end':''}" id="tclock">${mm}:${ss}</div><div class="tprog"><i style="width:${(1-tm.left/tot)*100}%"></i></div>
   <div class="tdiag" id="tdiag">${animBlock(e.d)}</div><p class="tkeys"><b>Clé :</b> ${e.k[0]}</p>
   <div class="tbtns"><button data-act="tprev">◀ Bloc précédent</button><button class="main" id="tplay" data-act="tplay">${tm.run?'Pause':'Démarrer'}</button><button data-act="tnext">Bloc suivant ▶</button></div>
   <p class="tkeys" style="font-size:13px;opacity:.75">${next?`Ensuite : ${PH[next.ex.ph]} · ${next.ex.n} (${next.min} min)`:'Dernier bloc de la séance'}</p></div>`;
  tm.anim=bindAnim(document.querySelector('#tdiag .anim-wrap'),e.d,true);
}
function tick(){if(tm.left>0){tm.left--;if(tm.left===30)beep(1);}if(tm.left===0){beep(3);if(tm.i<tm.blocks.length-1){tm.i++;tm.left=tm.blocks[tm.i].min*60;}else stopRun();}renderTimer();}
function stopRun(){tm.run=false;clearInterval(tm.h);wake(false);}
function toggleRun(){if(tm.run)stopRun();else{tm.run=true;try{tm.ac&&tm.ac.resume();}catch(e){}tm.h=setInterval(tick,1000);wake(true);}renderTimer();}
function moveBlk(d){const n=tm.i+d;if(n<0||n>=tm.blocks.length)return;tm.i=n;tm.left=tm.blocks[n].min*60;renderTimer();}
function closeTimer(){stopRun();if(tm.anim){tm.anim.stop();tm.anim=null;}tm.shown=-1;$('timer').hidden=true;}

/* =================== Événements =================== */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act],[data-tab],[data-open],[data-swap],[data-dur],[data-th],[data-lph],[data-lth],[data-cat],[data-pf]');if(!el)return;
  const d=el.dataset;
  if(d.tab){if(!$('ov').hidden)closeOv();setTab(d.tab);window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'});return;}
  if(d.open){openEx(d.open);return;}
  if(d.swap!==undefined){swapGen(+d.swap);return;}
  if(d.dur){st.T=+d.dur;generate();renderGen();return;}
  if(d.th){st.theme=d.th;generate();renderGen();return;}
  if(d.lph){st.lph=d.lph;drawLib();return;}
  if(d.lth){st.lth=d.lth;drawLib();return;}
  if(d.pf){st.pf=d.pf;renderPane();return;}
  if(d.cat!==undefined){st.cat=+d.cat;st.catTouched=true;st.sess=[];renderTop();renderPane();return;}
  const id=d.id||null;
  switch(d.act){
    case 'close':closeOv();break;
    case 'xclose':closeEx();break;
    case 'settings':openSettings();break;
    case 'tsave':{const t={...(S.team?clone(S.team):{}),nom:$('t-nom').value.trim()||'Mon équipe',cat:+$('t-cat').value,n:+$('t-n').value};if(put('settings/team',t)){st.cat=t.cat;st.catTouched=false;closeOv();toast('Paramètres enregistrés.');}break;}
    case 'export':copyText(exportData(),"Export copié. Colle-le dans un fichier texte pour le garder.");break;
    case 'import':{try{const o=JSON.parse($('imp').value);if(!o||!o.players)throw 0;LOC={players:o.players||{},sessions:o.sessions||{},matches:o.matches||{},docs:o.docs||{}};locSave();fromLoc();closeOv();refresh();toast('Données importées.');}catch(e){toast("Cet export n'est pas valide. Copie-le en entier.");}break;}
    case 'clear-demo':clearDemo();break;
    case 'load-demo':{try{const o=JSON.parse($('demo-data').textContent);LOC={players:o.players,sessions:o.sessions,matches:o.matches,docs:o.docs};locSave();fromLoc();st.cat=+(S.team&&S.team.cat)||7;st.sess=[];if(!$('ov').hidden)closeOv();setTab('home');toast('Équipe simulée chargée.');}catch(e){toast("Impossible de charger l'équipe simulée.");}break;}
    case 'pedit':openPlayer(id);break;
    case 'pview':openPlayerView(id);break;
    case 'timer-s':{const s=S.sessions.find(x=>x.id===id);if(s)openTimer(sessBlocksForTimer(s),s.title||MDINFO[s.md]||'Séance');break;}
    case 'psave':savePlayer(id);break;
    case 'pdel':if(el.dataset.confirm){put('players/'+id,null);closeOv();toast('Joueur supprimé.');}else{el.dataset.confirm='1';el.textContent='Confirmer la suppression';}break;
    case 'plan-create':{const a=$('sp-start').value,b=$('sp-end').value;if(!a||!b||b<=a){toast('Vérifie les dates : la fin doit être après le début.');break;}put('season/plan',{start:a,end:b,phases:defaultPhases(a,b)});break;}
    case 'plan-edit':openPlan();break;
    case 'ph-add':{const rows=$('phrows');const i=rows.children.length;rows.insertAdjacentHTML('beforeend',`<div class="form" style="border-bottom:1px solid var(--line);padding-bottom:12px" data-ph="${i}"><div class="field"><label>Nom</label><input data-k="nom" value="Nouvelle phase"></div><div class="field"><label>Objectif</label><input data-k="focus"></div><div class="field"><label>Début</label><input type="date" data-k="start" value="${TODAY}"></div><div class="field"><label>Fin</label><input type="date" data-k="end" value="${addD(TODAY,27)}"></div></div>`);break;}
    case 'plan-save':{const a=$('pl-start').value,b=$('pl-end').value;if(!a||!b||b<=a){toast('Vérifie les dates de la saison.');break;}const p={...clone(S.plan),start:a,end:b,phases:readPhases()};delete p.demo;if(put('season/plan',p)){closeOv();toast('Plan de saison enregistré.');}break;}
    case 'weeks-toggle':st.allWeeks=!st.allWeeks;renderPane();break;
    case 'genweek':openGenWeek(d.date);break;
    case 'gw-go':createWeek();break;
    case 'regen':generate();renderGen();break;
    case 'gen-timer':openTimer(st.sess.map(b=>({ex:b.ex,min:b.min})),'Séance '+CATS[st.cat].k);break;
    case 'gen-save':openSessionEditor(null,{title:'Séance '+CATS[st.cat].k,blocks:st.sess.map(b=>({ex:b.ex.id,min:b.min}))});break;
    case 'sedit':openSessionEditor(id);break;
    case 'ssave':saveSession();break;
    case 'sdel':if(el.dataset.confirm){put('sessions/'+id,null);closeOv();toast('Séance supprimée.');}else{el.dataset.confirm='1';el.textContent='Confirmer la suppression';}break;
    case 'se-add':syncDraft();draft.blocks.push({ex:avail('pri')[0]?avail('pri')[0].id:'rondo',min:15});drawEditor();break;
    case 'se-rm':syncDraft();draft.blocks.splice(+d.i,1);drawEditor();break;
    case 'se-fill':{syncDraft();const b=buildMD(draft.md);if(!b){toast('Choisis un jour du microcycle (J+1 à J-1) pour remplir la séance.');break;}draft.blocks=b.blocks;if(!draft.obj)draft.obj=b.obj;if(!draft.title)draft.title=MDINFO[draft.md];drawEditor();break;}
    case 'sview':openSessionView(id);break;
    case 'sv-timer':{const s=S.sessions.find(x=>x.id===viewId);if(s)openTimer(sessBlocksForTimer(s),s.title||MDINFO[s.md]||'Séance');break;}
    case 'sv-copy':{const s=S.sessions.find(x=>x.id===viewId);if(s)copyText(sessText(`${(s.title||'Séance').toUpperCase()} · ${frDate(s.date,{weekday:'long',day:'numeric',month:'long'})} · ${s.md||''} · ${s.dur} min${s.obj?'\nObjectif : '+s.obj:''}`,sessBlocksForTimer(s)),'Fiche copiée.');break;}
    case 'att-all':patchSession(s=>{s.att=s.att||{};S.players.forEach(p=>{if(p.statut!=='blesse'&&p.statut!=='absent')s.att[p.id]=true;});});break;
    case 'medit':openMatch(id);break;
    case 'msave':saveMatch(id);break;
    case 'mdel':if(el.dataset.confirm){put('matches/'+id,null);closeOv();toast('Match supprimé.');}else{el.dataset.confirm='1';el.textContent='Confirmer la suppression';}break;
    case 'tclose':closeTimer();break;
    case 'tplay':toggleRun();break;
    case 'tnext':moveBlk(1);break;
    case 'tprev':moveBlk(-1);break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.att){const pid=t.dataset.att;patchSession(s=>{s.att=s.att||{};if(t.checked)s.att[pid]=true;else{delete s.att[pid];if(s.rpe)delete s.rpe[pid];}});return;}
  if(t.dataset.rpe){const pid=t.dataset.rpe;patchSession(s=>{s.rpe=s.rpe||{};if(t.value)s.rpe[pid]=+t.value;else delete s.rpe[pid];});return;}
  if(t.id==='sv-notes'){patchSession(s=>{s.notes=t.value.trim();});return;}
  if(t.id==='gw-date'||t.id==='gw-n'){previewWeek();return;}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;drawLib();}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('ovx').hidden)closeEx();else if(!$('timer').hidden)closeTimer();else if(!$('ov').hidden)closeOv();});
['ov','ovx'].forEach(k=>$(k).addEventListener('click',e=>{if(e.target.id===k)k==='ov'?closeOv():closeEx();}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tm.run)wake(true);});
let hov=null;
function hoverCard(c){if(hov&&hov.card===c)return;if(hov){hov.a.stop();hov=null;}if(!c||reduceMotion)return;const ex=EXI[c.dataset.hover];if(!ex)return;const a=makeAnim(c.querySelector('svg'),ex.d,c.querySelector('.stepcap'));if(a){a.play();hov={card:c,a};}}
document.addEventListener('mouseover',e=>hoverCard(e.target.closest('.ex[data-hover]')));
document.addEventListener('focusin',e=>hoverCard(e.target.closest('.ex[data-hover]')));

if(location.hash&&PANES[location.hash.slice(1)])st.tab=location.hash.slice(1);
if(!PANES[st.tab])st.tab='home';
refresh();
initStore();
</script>
<script>
/* Application installable : service worker + aide à l'installation */
(function(){
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  if(standalone)return;
  let seen=false;try{seen=localStorage.getItem('cdc-install-vu')==='1';}catch(e){}
  if(seen)return;
  const ua=navigator.userAgent;const ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const box=document.createElement('div');box.className='install';box.setAttribute('role','dialog');box.setAttribute('aria-label',"Installer l'application");
  const close=()=>{box.remove();try{localStorage.setItem('cdc-install-vu','1');}catch(e){}};
  const share='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>';
  if(ios){
    const safari=/Safari/.test(ua)&&!/CriOS|FxiOS|EdgiOS/.test(ua);
    box.innerHTML=safari
      ?`<p><b>Installer l'application sur l'iPhone</b><br>1. Touche ${share} <b>Partager</b> en bas de Safari.<br>2. Fais défiler et touche <b>Sur l'écran d'accueil</b>.<br>3. Touche <b>Ajouter</b>. L'icône « Coach » apparaît sur l'écran d'accueil.</p><div class="row"><button class="btn small ghost" data-x>Plus tard</button></div>`
      :`<p><b>Installer l'application sur l'iPhone</b><br>Ouvre ce lien dans <b>Safari</b> (copie l'adresse et colle-la dans Safari), puis Partager → Sur l'écran d'accueil.</p><div class="row"><button class="btn small ghost" data-x>Plus tard</button></div>`;
    document.body.appendChild(box);
  }else{
    window.addEventListener('beforeinstallprompt',ev=>{
      ev.preventDefault();
      box.innerHTML=`<p><b>Installer l'application « Coach »</b><br>Elle s'ouvrira comme une application, même sans connexion.</p><div class="row"><button class="btn small ghost" data-x>Plus tard</button><button class="btn small" data-i>Installer</button></div>`;
      document.body.appendChild(box);
      box.querySelector('[data-i]').onclick=async()=>{ev.prompt();try{await ev.userChoice;}catch(e){}close();};
      box.querySelector('[data-x]').onclick=close;
    });
  }
  box.addEventListener('click',e=>{if(e.target.closest('[data-x]'))close();});
})();
</script>
</body>
